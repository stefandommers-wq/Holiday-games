name: Publiceren naar GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  controle:
    name: Precache-controle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Staat elk bestand in de service worker?
        run: node tools/check-precache.mjs

  publiceren:
    name: Publiceren
    needs: controle
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Let op: Pages moet eenmalig aan staan onder Settings > Pages met
      # Source op "GitHub Actions". De workflow-token mag dat zelf niet
      # aanzetten, dus enablement heeft hier geen zin.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
